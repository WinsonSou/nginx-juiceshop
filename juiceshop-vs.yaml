apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: juiceshop-vs
  namespace: juice
spec:
  host: juiceshop.example.com
  tls:
    secret: juice-secret
#  policies:
#  - name: waf-policy # App Protect Demo
  upstreams:
  - name: juiceshop
    service: juiceshop-svc
    port: 80
    healthCheck:
      enable: true
      port: 3000
      path: /black
      interval: 20s
      jitter: 3s
      fails: 3
      passes: 1
      connect-timeout: 30s
      read-timeout: 30s
  - name: juiceshop-v2
    service: juiceshop-svc-v2
    port: 80
    healthCheck:
      enable: true
      port: 3000
      path: /white
      interval: 20s
      jitter: 3s
      fails: 3
      passes: 1
      connect-timeout: 30s
      read-timeout: 30s
  routes:
  - path: /
    splits:
      - weight: 80
        action: 
          pass: juiceshop
      - weight: 20
        action:
          pass: juiceshop-v2
  - path: /white
    action:
      pass: juiceshop-v2
  - path: /black
    action:
      pass: juiceshop
